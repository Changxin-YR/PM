spec_version: PMO-Standalone-1.0.4
rule_version: lite-v1.0-standalone.3
source_document: 原始业务方案_PMOLite.html
source_date: 2026-11-13
implementation_date: '2026-11-19'
provenance:
  business: original_lite_html
  completion: explicit_implementation_decisions
settings:
  timezone: Asia/Shanghai
  currency: CNY
  hour_per_person_day: 8
  project_count_target_less_than: 15
  milestone_limit: 8
  milestone_min_before_feasibility: 3
  baseline_requirement_min_before_feasibility: 1
  weekly_report:
    week_starts: monday
    due_next_monday_local: '18:00'
    consecutive_misses_to_untrusted: 2
    required_sections:
    - milestone_progress
    - effort_person_days
    - requirement_progress
    - risks_and_blockers
    money_spending_section: optional_link_to_verified_postings
    submitted_counts_for_presence_if_schema_valid: true
    confirmed_required_for_publication: true
  required_lesson_count_before_archive: 1
  post_close_retrospective_reminder_days: 14
  pending_approval_content_hash_required: true
  any_active_authenticated_person_may_create_draft: true
  sponsor_and_pm_required_before_charter_review: true
  draft_allows_sponsor_pm_null: true
scorecards:
  score_min: 1
  score_max: 5
  score_type: integer
  reviewer_min: 1
  appeal_max_per_submission: 1
  require_anchor_choice: true
  require_rationale: true
  charter:
    dimension_weights:
      strategic_alignment: '0.20'
      customer_attractiveness: '0.30'
      financial_resource_return: '0.25'
      risk_controllability: '0.25'
    fast_track_score_gte: '4.20'
    normal_pass_score_gte: '3.20'
    normal_pass_score_lt: '4.20'
    any_effective_reviewer_dimension_eq_one_veto: true
    rejected_resubmit_within_days: 30
    rejected_resubmit_max: 1
    fast_track_requires_sponsor_confirmation: true
    dimension_aggregation: arithmetic_mean_per_dimension_across_effective_reviewers
    low_dimension_mean_score_lte: '3.00'
    anchor_2: above_1_below_3_requires_reason
    anchor_4: above_3_below_5_requires_reason
    reviewers_freeze_before_independent_scoring: true
    reviewer_self_approval_forbidden: true
  feasibility:
    dimensions:
    - technical_path
    - resource_match
    - external_dependencies
    - time_reasonableness
    - acceptance_criteria
    any_score_lte: 2
    conditional_pass_requires_task_owner_and_due_date: true
  closing:
    all_active_p0_customer_confirmed: true
    weighted_satisfaction_rate_gte: '0.90'
    money_absolute_variance_lte: '0.20'
    effort_absolute_variance_lte: '0.20'
    all_blocking_risks_closed_or_formally_transferred: true
    conditional_close:
      customer_signed_deviation_acceptance: true
      review_decision_and_content_hash_required: true
      money_or_effort_over_20_percent_not_directly_exceptable: true
      approved_budget_change_requires_change_entry_and_recalculation: true
      original_baseline_variance_remains_visible_after_rebaseline: true
      exception_scope: requirements_only
      does_not_waive_money_variance: true
      does_not_waive_effort_variance: true
      does_not_waive_blocking_risk: true
      must_list_accepted_requirement_ids: true
      requires_verified_customer_evidence: true
      requires_human_reviewer_decision: true
      requires_current_content_hash: true
    gate_formula: (requirements_ok OR valid_requirement_exception) AND money_ok AND effort_ok AND blocking_risks_ok
requirement:
  weights:
    P0: 3
    P1: 2
    P2: 1
  statuses:
  - baseline
  - delivered
  - accepted
  - customer_confirmed
  - cancelled
  approved_cancelled_excluded_from_active_denominator: true
  unapproved_scope_changes_freeze_status: true
  unapproved_scope_changes_kept_in_denominator: true
  planned_confirm_at_required_for_baseline: true
  zero_active_denominator_returns: UNAVAILABLE
  change_rate_denominator: initial_baseline_requirement_count
  zero_initial_baseline_change_rate_returns: UNAVAILABLE
money_effort:
  forecast_means: remaining_only
  projected_total_formula: actual_to_date_plus_forecast_remaining
  compare_threshold_before_rounding: true
  monetary_decimal_places: 2
  effort_decimal_places: 2
  empty_budget_and_zero_projected_total: zero_budget_accepted_with_reason
  zero_budget_positive_projected_total: red
  absent_budget: untrusted
  green_variance_lte: '0.05'
  yellow_variance_gt: '0.05'
  yellow_variance_lte: '0.15'
  red_variance_gt: '0.15'
  reestimate_charter_if_variance_gt: '0.20'
  status_aggregation: worst_of_money_and_effort
  cost_posting_states:
  - draft
  - pending
  - verified
  agent_can_propose_but_not_verify_posting: true
  zero_budget_no_spending_needs_declaration: true
  reversed_is_derived_view_not_mutation: true
  actual_calculation: sum_signed_verified_postings_once_including_verified_reversals
  reversal:
    original_verified_posting_kept_in_sum: true
    verified_negative_reversal_kept_in_sum: true
    no_double_subtraction: true
    one_full_reversal_per_original_max: 1
    partial_correction_strategy: full_reversal_then_new_verified_corrected_posting
    unverified_reversal_has_no_effect: true
    negative_net_balance_for_nonnegative_costs_rejected: true
health:
  time:
    green_delay_days_lte: 3
    yellow_delay_days_gte: 4
    yellow_delay_days_lte: 10
    red_delay_days_gt: 10
    unfinished_key_milestone_past_planned_date_is_red: true
    completed_milestone_slippage_historical_only: true
    key_milestone_claimed_progress_or_completion_requires_evidence: true
  quality:
    original_lite_strict_p0_unconfirmed_is_red: true
    confirmed_dispute_is_red: true
    schedule_lag_one_week_is_yellow: true
    non_p0_schedule_lag_two_or_more_weeks_is_red: true
    note: 按原文严格执行P0未确认红灯；本定版显式记录误报风险，只有获批升级规则版本才能调整。
  aggregate:
    any_red: red
    two_or_more_yellow_without_red: yellow
    zero_or_one_yellow_without_red: green
    data_untrusted_overrides_color: untrusted
    source_snapshot_required: true
states:
- drafting
- charter_review
- rejected
- designing
- feasibility_review
- executing
- on_hold
- delivering
- closing_review
- closed
- retrospective
- terminated
- archived
allowed_transitions:
  drafting:
  - charter_review
  charter_review:
  - designing
  - drafting
  - rejected
  rejected:
  - drafting
  - terminated
  designing:
  - feasibility_review
  feasibility_review:
  - executing
  - designing
  - terminated
  executing:
  - on_hold
  - delivering
  - terminated
  on_hold:
  - executing
  - terminated
  delivering:
  - closing_review
  - executing
  closing_review:
  - closed
  - executing
  - terminated
  closed:
  - retrospective
  retrospective:
  - archived
  terminated:
  - retrospective
  archived: []
review_verdicts:
- pass
- conditional_pass
- defer
- redirect
- reject
rule_events:
  LR-01:
    kind: hard
    trigger: illegal_gate_skip_or_illegal_state_transition
    effect: refuse_transition
  LR-02:
    kind: hard
    trigger: feasibility_any_dimension_score_lte_2_and_request_pass
    effect: refuse_pass_and_create_remediation_task
  LR-03:
    kind: warning
    trigger: milestone_forecast_after_plan_without_approved_change
    effect: yellow_event_notify_pm_preserve_more_severe_health
  LR-04:
    kind: warning
    trigger: money_or_effort_variance_gt_15_percent
    effect: red_notify_sponsor_reassessment_if_gt_20_percent
  LR-05:
    kind: hard
    trigger: frozen_requirement_change_without_valid_change_entry
    effect: reject_change_and_freeze_acceptance_progress
  LR-06:
    kind: warning
    trigger: two_due_weekly_reports_missing_or_key_milestone_completion_without_evidence
    effect: mark_untrusted_pause_new_official_health_snapshot_notify_pm
  LR-07:
    kind: hard
    trigger: closing_gate_unmet_without_valid_written_conditional_exception
    effect: reject_close_and_return_gaps
  LR-08:
    kind: warning
    trigger: closed_14_days_without_retrospective_or_confirmed_lesson
    effect: notify_sponsor_and_report_monthly
agent:
  count: 1
  modes:
  - charter_review_assistant
  - process_manager
  - closing_review_assistant
  - ledger_qa
  cannot_finally_approve_gate: true
  cannot_customer_confirm: true
  cannot_auto_archive: true
  fact_high_trust_requires_validated_objective_evidence: true
  fact_low_trust_excluded_from_official_calculation: true
  model_failure_must_not_break_human_flow: true
mcp:
  v1_transport: stdio
  remote_streamable_http_release: v1.1
  read_only_by_default: true
  required_delegation_fields:
  - delegated_by
  - allowed_project_ids
  - allowed_actions
  - expires_at
  - revoked_at
  forbidden_tools:
  - execute_sql
  - arbitrary_table_write
  - set_stage
  - approve_gate
  - customer_confirm
  - project_archive
  mutation_requires_idempotency_key: true
  update_requires_expected_revision: true
  additional_lite_tools:
  - pmo_milestone_create
  - pmo_milestone_draft_update
  - pmo_requirement_create
  - pmo_requirement_draft_update
  - pmo_risk_create
  - pmo_risk_update
  - pmo_cost_budget_draft_save
  - pmo_cost_forecast_save
  - pmo_stakeholder_create
  - pmo_review_list
  - pmo_decision_get
  - pmo_requirement_change_history
  - pmo_preapproval_spending_list
  - pmo_report_list
  - pmo_alert_list
  - pmo_transition_request
  - pmo_cost_posting_propose
  - pmo_project_draft_update
  - pmo_role_assignment_propose
  - pmo_report_get
  - pmo_lessons_search
  - pmo_health_get
  sensitive_rest_endpoints_reject_agent_tokens_even_if_called_directly: true
  must_test_every_m0_declared_host: true
  sdk_version_strategy: pin_v2_supported_version_and_verify_host_compatibility
  sdk_version_candidate: 2.3.0
  sdk_version_requires_real_host_test: true
  required_tools_manifest: 11_MCP_工具契约.json
  org_scoped_project_draft_create:
    action: pmo_project_create
    requires_active_delegator_in_same_org: true
    requires_explicit_org_create_grant: true
    target_org_derived_from_verified_token_not_request: true
    allowed_project_ids_may_be_empty_for_org_create_only: true
    new_project_creator_is_delegator_not_agent_principal: true
    new_project_automatically_inherits_only_delegator_draft_access: true
    does_not_automatically_grant_sponsor_pm_or_reviewer: true
    new_project_id_appended_to_same_agent_token_scope_atomically: true
    new_project_scope_is_creator_draft_only_not_roles: true
    agent_token_scope_cannot_expand_to_other_projects_without_new_human_grant: true
    agent_token_scope_creation_write_and_project_creation_atomic: true
  no_client_supplied_identity_or_org_elevation: true
pending_business_approval_decisions:
- DEC-04
- DEC-07
- DEC-09
- DEC-16
- DEC-18
- DEC-19
- DEC-20
- DEC-26
source_original_upload: PMO本体设计方案-Lite(1).html
project_creator:
  scope: any_active_authenticated_org_person
  initial_stage: drafting
  initiator_can_edit_owned_draft: true
  initiator_cannot_approve_gate: true
  role_assignment: proposed_by_authorized_person_and_accepted_by_assignee
  assignment_statuses:
  - pending
  - accepted
  - declined
  - revoked
  sponsor_pm_membership_must_be_accepted_for_charter_review: true
  agent_cannot_accept_role_assignment: true
audit:
  successful_writes_and_audit_same_transaction: true
  rejected_business_transaction_must_rollback: true
  denied_attempt_audit_in_separate_safe_transaction: true
  never_persist_false_success_on_rejection: true
  idempotency_key_scope: actor_id+operation+key
  security_denials_must_log_if_audit_writable: true
  security_audit_failure_must_alert_and_not_allow_rejected_operation: true
validation:
  static_oracle_is_not_product_test: true
  all_reference_vectors_must_be_evaluated: true
  mutation_tests_required: true
  no_prerequisite_approval_inferred_from_implementation_default: true
engineering_assurance:
  policy_approval_status: UNSIGNED_DEFAULTS_ONLY
  idempotency_replay_requires_persisted_response_payload: true
  outbox_retry_and_dead_letter_required: true
  append_only_audit_requires_event_time: true
  all_web_and_mcp_authorization_in_application_service: true
  per_transition_actor_permission_matrix_required: true
  person_role_field_is_descriptive_not_authoritative: true
  manual_roles_must_resolve_from_project_membership_or_org_grants: true
  verified_cost_postings_summed_once: true
  candidate_fact_and_evidence_not_in_authoritative_metrics: true
  mcp_tool_structured_output_contracts_are_design_not_sdk_proof: true
