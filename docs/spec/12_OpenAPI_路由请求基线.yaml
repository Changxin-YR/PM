          pattern: ^[1-9][0-9]*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fieldsMilestone:
                  type: object
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 160
                    plannedDate:
                      type: string
                      format: date
                    forecastDate:
                      type: string
