openapi: 3.1.0
info:
  title: PMO Standalone V1.0 API - M0 baseline
  version: 1.0.4
  description: 第三轮终审完成的 M0 路由与入参基线：路径和高危访问边界已对齐，但尚非运行中的 FastAPI OpenAPI。M0 必须补齐响应 data 专用 Schema 和实测。
servers:
- url: http://127.0.0.1:8000
  description: 仅本地开发示例，生产由真实 HTTPS 域名替换
security:
- SessionCookie: []
- AgentToken: []
paths:
  /api/v1/projects:
    get:
      operationId: pmo_project_list
      summary: 检索授权范围内项目
      x-actorTypes:
      - human
      - agent
      x-scope: delegated_project_access
      x-toolKind: read
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: 权限拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务门槛拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: query
        name: filters
        required: false
        schema:
          type: object
          properties:
            stage:
              type: string
            keyword:
              type: string
              maxLength: 160
          additionalProperties: false
        style: deepObject
        explode: true
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    post:
      operationId: pmo_project_create
      summary: 只创建本人草稿，不直接授予 sponsor/pm；角色任命需单独邀请并接受；Agent 创建须有显式 allowProjectCreate 授权，orgId 和 creatorId 只能从已验证委托主体推导
      x-actorTypes:
      - human
      - agent
      x-scope: delegated_organization_project_create_for_agent__human_authenticated_org_member
      x-toolKind: draft_write
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: 权限拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务门槛拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 2
                  maxLength: 60
                  pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                description:
                  type: string
                  maxLength: 2000
              required:
              - code
              - name
              additionalProperties: false
  /api/v1/projects/{projectId}:
    get:
      operationId: pmo_project_get
      summary: 获取授权项目及当前版本
      x-actorTypes:
      - human
      - agent
      x-scope: delegated_project_access
      x-toolKind: read
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: 权限拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务门槛拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: pmo_project_draft_update
      summary: 本人未送审草稿可编辑
      x-actorTypes:
      - human
      - agent
      x-scope: delegated_project_access
      x-toolKind: draft_write
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: 权限拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务门槛拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - in: header
        name: If-Match
        required: true
        description: 当前业务记录 revision，十进制整数
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  maxProperties: 12
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 160
                    description:
                      type: string
                      maxLength: 2000
              required:
              - fields
              additionalProperties: false
  /api/v1/projects/{projectId}/role-invitations:
    post:
      operationId: pmo_role_assignment_propose
      summary: 创建角色任命邀请申请；本人必须在 Web 接受
      x-actorTypes:
      - human
      - agent
      x-scope: delegated_project_access
      x-toolKind: approval_request
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: 权限拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务门槛拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - in: header
        name: If-Match
        required: true
        description: 当前业务记录 revision，十进制整数
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                personId:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum:
                  - sponsor
                  - pm
              required:
              - personId
              - role
              additionalProperties: false
  /api/v1/projects/{projectId}/charter:
    put:
      operationId: pmo_charter_save
      summary: 草稿立项卡增量保存
      x-actorTypes:
      - human
      - agent
      x-scope: delegated_project_access
      x-toolKind: draft_write
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: 权限拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务门槛拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - in: header
        name: If-Match
        required: true
        description: 当前业务记录 revision，十进制整数
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fieldsCharter:
                  type: object
                  additionalProperties: false
                  properties:
                    valueProp:
                      type: string
                      minLength: 1
                      maxLength: 3000
                    targetClient:
                      type: string
                      minLength: 1
                      maxLength: 2000
                    attractiveness:
                      type: string
                      minLength: 1
                      maxLength: 3000
                    expectedBenefit:
                      type: string
                      minLength: 1
                      maxLength: 3000
                    successCriteria:
                      type: string
                      minLength: 1
                      maxLength: 3000
                    roughCost:
                      type: string
                      pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
                    roughEffort:
                      type: string
                      pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
                    roughDuration:
                      type: integer
                      minimum: 1
                      maximum: 3650
                    topRisks:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required:
                        - statement
                        - response
                        properties:
                          statement:
                            type: string
                            minLength: 1
                          response:
                            type: string
                            minLength: 1
                        additionalProperties: false
              required:
              - fieldsCharter
              additionalProperties: false
    get:
      operationId: human_charter_get
      summary: project_member 的 human_charter_get 操作
      x-actorTypes:
      - human
      security:
      - SessionCookie: []
      x-requiredRole: project_member
      responses:
        '200': &id002
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401': &id001
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403': *id001
        '409': *id001
        '422': *id001
      x-forbidAgentEvenViaHttp: true
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/projects/{projectId}/reviews/prepare:
    get:
      operationId: pmo_review_prepare
      summary: 生成关口检查及材料草稿不形成裁决
      x-actorTypes:
      - human
      - agent
      x-scope: delegated_project_access
      x-toolKind: derived_read
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: 权限拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务门槛拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: gate
        required: true
        schema:
          type: string
          enum:
          - charter
          - feasibility
          - closing
  /api/v1/projects/{projectId}/reviews:
    post:
      operationId: pmo_review_submit
      summary: 提交评审申请，不得代审批
      x-actorTypes:
      - human
      - agent
      x-scope: delegated_project_access
      x-toolKind: approval_request
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: 权限拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务门槛拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      - in: header
        name: If-Match
        required: true
        description: 当前业务记录 revision，十进制整数
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewType:
                  type: string
                  enum:
                  - charter
                  - feasibility
                  - closing
              required:
              - reviewType
              additionalProperties: false
    get:
      operationId: pmo_review_list
      summary: 项目评审与状态
      x-actorTypes:
      - human
      - agent
      x-scope: delegated_project_access
      x-toolKind: read
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: 权限拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务门槛拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/reviews/{reviewId}/decisions:
    get:
      operationId: pmo_decision_get
      summary: 授权审查决议
      x-actorTypes:
      - human
      - agent
      x-scope: delegated_project_access
      x-toolKind: read
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: 权限拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务门槛拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: reviewId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: human_review_decide
      summary: reviewer 人工最终操作
      x-actorTypes:
      - human
      x-forbidAgentEvenViaHttp: true
      x-requiredRole: reviewer
      security:
      - SessionCookie: []
      parameters:
      - in: path
        name: reviewId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                verdict:
                  type: string
                  enum:
                  - pass
                  - conditional_pass
                  - defer
                  - redirect
                  - reject
                rationale:
                  type: string
                  minLength: 4
                approvalRequestId:
                  type: string
                  format: uuid
              required:
              - verdict
              - rationale
              - approvalRequestId
              additionalProperties: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: Agent 及无权人被拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
